name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Go on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      # The overlay and notice tests measure Chinese text: they need a CJK
      # font (fc-list :lang=zh), which the runner image lacks.
      - name: Chinese fonts
        run: |
          # The runner's package mirror sometimes serves an incomplete index:
          # retry the update and the install a few times.
          for i in 1 2 3; do
            sudo apt-get update -qq || true
            if sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk; then break; fi
            [ "$i" = 3 ] && exit 1
            sleep 15
          done
          fc-list :lang=zh family | head -3

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: MyGo vet
        run: go tool mygo vet .

      - name: Vet the update-check build
        run: go vet -tags updatecheck ./app

      - name: gofmt and dead code (staticcheck U1000, deadcode)
        run: scripts/lint.sh

      - name: Tests of internal/...
        run: go test -p 4 ./internal/...

      - name: Tests of the app package (app/, sharded)
        run: scripts/test-main.sh -n 4
