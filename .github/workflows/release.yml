name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sign:
        description: Sign and notarize with the repository secrets
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS Apple silicon
    runs-on: macos-26
    timeout-minutes: 240
    env:
      RELEASE: ${{ github.event_name == 'push' }}
      SIGN: ${{ github.event_name == 'push' || inputs.sign }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check version and release notes
        run: |
          version="$(jq -r .version mygo.json)"
          if [ "$RELEASE" = true ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match mygo.json version $version"
            exit 1
          fi
          if [ "$RELEASE" = true ] && ! grep -Fq "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check signing and publishing secrets
        if: env.SIGN == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          ACTNOW_INGEST_TOKEN: ${{ secrets.ACTNOW_INGEST_TOKEN }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          missing=""
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPLE_TEAM_ID APPLE_ID APPLE_APP_PASSWORD MYGO_UPDATER_PRIVATE_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ "$RELEASE" = true ] && [ -z "$ACTNOW_INGEST_TOKEN" ]; then missing="$missing ACTNOW_INGEST_TOKEN"; fi
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing (see docs/release.md)"
            exit 1
          fi

      - name: Select Xcode 26 and Metal toolchain
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          [ -z "$xcode" ] || sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Import Developer ID and notarization credentials
        if: env.SIGN == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          xcrun notarytool store-credentials notary --keychain "$keychain" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          identity="$(security find-identity -v -p codesigning "$keychain" | grep 'Developer ID Application' | grep "($APPLE_TEAM_ID)" | head -1 | awk '{print $2}')"
          [ -n "$identity" ] || { echo "::error::no Developer ID Application identity for $APPLE_TEAM_ID"; exit 1; }
          echo "VOXTMINI_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Prepare update key
        if: env.SIGN == 'true'
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          key="$RUNNER_TEMP/mygo-update.key"
          umask 077
          printf '%s' "$MYGO_UPDATER_PRIVATE_KEY" > "$key"
          echo "VOXTMINI_UPDATE_KEY=$key" >> "$GITHUB_ENV"

      - name: Build, sign, notarize and publish to ActNow
        if: env.RELEASE == 'true'
        env:
          ACTNOW_INGEST_TOKEN: ${{ secrets.ACTNOW_INGEST_TOKEN }}
        run: scripts/release.sh --notarize notary --keychain "$NOTARY_KEYCHAIN" --publish

      - name: Build signed dry run
        if: env.RELEASE != 'true' && env.SIGN == 'true'
        run: scripts/release.sh --notarize notary --keychain "$NOTARY_KEYCHAIN"

      - name: Build unsigned dry run
        if: env.RELEASE != 'true' && env.SIGN != 'true'
        run: scripts/release.sh

      - name: Draft the GitHub release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-github.sh "v$VERSION"

      - name: Upload dry-run installer
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VoxtMini-${{ env.VERSION }}-${{ env.SIGN == 'true' && 'notarized' || 'adhoc' }}
          path: build/darwin-arm64/*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing keychain
        if: always() && env.NOTARY_KEYCHAIN != ''
        run: security delete-keychain "$NOTARY_KEYCHAIN" || true
