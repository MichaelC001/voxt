name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  macos-tests:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

    steps:
      - uses: actions/checkout@v5

      - name: Audit model stack source
        run: python3 -B -m unittest discover -s tools -p 'test_*.py' -v

      - name: Configure consistent build and MLX JIT toolchain
        run: source tools/configure_xcode.sh --select-system

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Reset SwiftPM binary artifact cache
        run: |
          SPM_CACHE_PATH="$RUNNER_TEMP/spm-cache"
          SPM_CLONE_PATH="$RUNNER_TEMP/spm-source-packages"
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf "$SPM_CACHE_PATH" "$SPM_CLONE_PATH"
          mkdir -p "$SPM_CACHE_PATH" "$SPM_CLONE_PATH"

      - name: Resolve Swift packages
        run: |
          SPM_CACHE_PATH="$RUNNER_TEMP/spm-cache"
          SPM_CLONE_PATH="$RUNNER_TEMP/spm-source-packages"
          bash tools/resolve_dependencies.sh \
            -clonedSourcePackagesDirPath "$SPM_CLONE_PATH" \
            -packageCachePath "$SPM_CACHE_PATH" \
            -disablePackageRepositoryCache \
            -skipPackagePluginValidation

      - name: Preserve resolved dependency graph
        uses: actions/upload-artifact@v4
        with:
          name: resolved-dependencies
          path: Voxt.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: error

      - name: Run tests
        run: |
          SPM_CACHE_PATH="$RUNNER_TEMP/spm-cache"
          SPM_CLONE_PATH="$RUNNER_TEMP/spm-source-packages"
          xcodebuild test \
            -project Voxt.xcodeproj \
            -scheme Voxt \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath "$SPM_CLONE_PATH" \
            -packageCachePath "$SPM_CACHE_PATH" \
            -disablePackageRepositoryCache \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
